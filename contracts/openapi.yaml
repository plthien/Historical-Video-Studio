      tags: [gate]
      summary: Sole human decision endpoint; G2 APPROVED also triggers final WAV assemble + alignment job
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/GateId'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
