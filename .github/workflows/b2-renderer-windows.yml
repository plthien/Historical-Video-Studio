name: B2 Remotion I Native Windows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  b2-real-render:
    runs-on: windows-latest
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diff/lineage
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact Remotion lock on Windows
        id: renderer_deps
        shell: pwsh
        run: |
          Push-Location renderer
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
          npm --prefix renderer run verify:toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix renderer run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real FFmpeg and FFprobe binaries before B1 fixture generation
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
                $installed = $true; break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $installed) { throw "FFmpeg and ffprobe unavailable on Windows runner" }
          }
      - name: Produce genuine B1 compiler A/B/C synthetic inputs
        id: b1_fixture
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m renderer.scripts.export_b1_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PR10 authoritative numeric/G3 choice and reviewed mask owner tests
        id: source_auth
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/backend/test_numeric_series.py tests/assets/test_choice_sets.py tests/assets/test_mask_derivative.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 targeted visual-functional real-frame repair gates
        id: host_fixture
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m renderer.scripts.prepare_host_fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix renderer run test:repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shared composition with real pixel hashes
        shell: pwsh
        run: |
          npm --prefix renderer run test:frames -- --case shared-composition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix renderer run render:smoke -- --case single-scene
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Remotion scenes T01 to T05
        shell: pwsh
        run: |
          npm --prefix renderer run test:frames -- --templates T01,T02,T03,T04,T05
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix renderer run render:smoke -- --templates T01,T02,T03,T04,T05
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Remotion scenes T06 to T10
        shell: pwsh
        run: |
          npm --prefix renderer run test:frames -- --templates T06,T07,T08,T09,T10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix renderer run render:smoke -- --templates T06,T07,T08,T09,T10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protected B1 regression owners and six smoke checks
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/visual/test_compiler.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in @("normalize-visual","historical-map","align-scene-cues","compile-layout","compile-motion","compile-longform")) {
            & .venv/Scripts/python.exe -m backend.tools.smoke --case $case --mode local
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Owners remain independent: a failed Player must not suppress the later
      # renderer/SQLite/long-project evidence. 'outcome', not 'conclusion',
      # is checked by the final aggregate nonzero gate.
      - name: B2 motion phase Chromium frames
        id: motion
        if: ${{ always() && steps.b1_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix renderer run test:frames -- --case motion-phases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 multi-layer H264 Chromium render
        id: multilayer
        if: ${{ always() && steps.b1_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix renderer run render:smoke -- --case multi-layer-visual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 G4 real SQLite editor API smoke
        id: sqlite
        if: ${{ always() && steps.host_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m backend.tools.smoke --case scene-edit --mode local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 frontend pinned dependencies and Chromium
        id: browser_setup
        if: ${{ always() && steps.b1_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 real browser Storyboard and Player frames
        id: editor
        if: ${{ always() && steps.host_fixture.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $env:HVS_B2_FIXTURE = '1'
          npm --prefix frontend run test:e2e -- --grep "storyboard-editor uses"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 real Browser Node paired frame parity
        id: parity
        if: ${{ always() && steps.host_fixture.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix renderer run test:frames -- --case player-renderer-parity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 prepare 61 scene SQLite native fixture
        id: fixture61
        if: ${{ always() && steps.b1_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m renderer.scripts.prepare_host_fixture --scene-count 61
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 61 scene UI real Player performance
        id: longui
        if: ${{ always() && steps.fixture61.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $env:HVS_B2_FIXTURE = '1'
          $env:HVS_B2_LONGFORM = '1'
          npm --prefix frontend run test:e2e -- --grep "longform-storyboard"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 61 scene registered Composition stills and H264 excerpt
        id: longrender
        if: ${{ always() && steps.b1_fixture.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix renderer run render:smoke -- --case 60-scene-longform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B2 mandatory owner aggregate verdict
        if: always()
        shell: pwsh
        env:
          B2_SOURCE_AUTH: ${{ steps.source_auth.outcome }}
          B2_MOTION: ${{ steps.motion.outcome }}
          B2_MULTILAYER: ${{ steps.multilayer.outcome }}
          B2_SQLITE: ${{ steps.sqlite.outcome }}
          B2_SETUP: ${{ steps.browser_setup.outcome }}
          B2_EDITOR: ${{ steps.editor.outcome }}
          B2_PARITY: ${{ steps.parity.outcome }}
          B2_FIXTURE61: ${{ steps.fixture61.outcome }}
          B2_LONGUI: ${{ steps.longui.outcome }}
          B2_LONGRENDER: ${{ steps.longrender.outcome }}
        run: |
          $results = @{
            source_auth=$env:B2_SOURCE_AUTH; motion=$env:B2_MOTION; multilayer=$env:B2_MULTILAYER; sqlite=$env:B2_SQLITE;
            browser_setup=$env:B2_SETUP; editor=$env:B2_EDITOR; parity=$env:B2_PARITY;
            fixture61=$env:B2_FIXTURE61; longui=$env:B2_LONGUI; longrender=$env:B2_LONGRENDER
          }
          $results | ConvertTo-Json | Out-File -FilePath "b2-owners.json" -Encoding utf8
          foreach ($entry in $results.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
          }
          # Independently parse real artifacts, not only the motion process exit.
          # Re-run the *same* production verifier with mutation negatives.
          & .venv/Scripts/python.exe renderer/scripts/verify_motion_ledgers.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "B2 cross-ledger/PNG/ROI or mutation integrity failed" }
          if (@($results.Values | Where-Object { $_ -ne 'success' }).Count -gt 0) {
            throw "B2 required owner failure or skipped dependency (see b2-owners.json)"
          }
      - name: Upload exact-render screenshot MP4 and ffprobe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-real-render-native-windows
          path: |
            renderer/.artifacts/renders/
            renderer/.artifacts/compiled-30.json
            frontend/.artifacts/parity/
            frontend/.artifacts/longform/
            frontend/.artifacts/typography/
            frontend/test-results/
            b2-owners.json
          if-no-files-found: warn
