name: A1 Foundation (Windows)
on:
  push:
    branches: [feat/fullflow-v1-windows]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg and ffprobe installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
                $installed = $true; break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $installed) { throw "FFmpeg and ffprobe could not be installed after bounded retries" }
          }
      - name: Temporary generate frontend lock for dependency capture
        shell: pwsh
        run: |
          npm install --package-lock-only --prefix frontend --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "__FRONTEND_LOCK_START__"
          Get-Content frontend/package-lock.json -Raw
          Write-Host "__FRONTEND_LOCK_END__"
      - name: Check branch diff whitespace against main
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A1 environment, schema and SQLite behavioral tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
      - name: Repeat bootstrap in the same isolated environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
      - name: Chromium browser E2E (real local servers)
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test:e2e -- --grep "project-shell"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
