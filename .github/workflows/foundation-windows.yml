name: A1 Foundation (Windows)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg and ffprobe installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
                $installed = $true; break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $installed) { throw "FFmpeg and ffprobe could not be installed after bounded retries" }
          }
      - name: Check branch diff whitespace against main
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A1 environment, schema and SQLite behavioral tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
      - name: Repeat bootstrap in the same isolated environment
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
      - name: PR10 G1 numeric approvals and G3 choices use real API SQLite
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/backend/test_numeric_series.py tests/assets/test_choice_sets.py tests/assets/test_mask_derivative.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B1-06 G4 approved SQLite closure and staging negatives
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          & $py -m pytest -q tests/visual/test_compiler.py -k "g4 or invariant or stale or fingerprint"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pytest -q tests/visual/test_compiler.py -k "cue or timing or staging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Task-scoped Windows gate, recovery and API checks
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          function Verify([string[]]$CommandArgs) {
            & $py @CommandArgs
            if ($LASTEXITCODE -ne 0) { throw "A1 owner command failed: $($CommandArgs -join ' ')" }
          }
          Verify -CommandArgs @("-m","pytest","-q","tests/backend/test_foundation.py","-k","gate or invalidation or revision")
          Verify -CommandArgs @("-m","backend.tools.smoke","--case","gate-transitions","--mode","local")
          Verify -CommandArgs @("-m","pytest","-q","tests/backend/test_foundation.py","-k","queue or restart or cancel")
          Verify -CommandArgs @("-m","backend.tools.smoke","--case","restart-running-job","--mode","local")
          Verify -CommandArgs @("-m","pytest","-q","tests/backend/test_foundation.py","-k","api or idempotency")
          Verify -CommandArgs @("-m","backend.tools.smoke","--case","api-and-ui","--mode","local")
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE -ne 0) { throw "A1 typed frontend check failed" }
      - name: A2-01/02 voice boundary, SQLite and FFmpeg regression
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          & $py -m pytest -q tests/voice/test_voice_pipeline.py -k "tts or identity or transport"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pytest -q tests/voice/test_voice_pipeline.py -k "attempt or correction or regenerate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pytest -q tests/voice/test_voice_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m backend.tools.smoke --case section-repair --mode local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A2-03/04/05 final voice owner checks
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          function Run-Owner([string[]]$argsList) {
            & $py @argsList
            if ($LASTEXITCODE -ne 0) { throw "A2 owner failed: $($argsList -join ' ')" }
          }
          Run-Owner @("-m","pytest","-q","tests/voice/test_voice_pipeline.py","-k","assemble or sample or final_wav or gate_2")
          Run-Owner @("-m","backend.tools.smoke","--case","final-wav","--mode","local")
          Run-Owner @("-m","pytest","-q","tests/voice/test_voice_pipeline.py","-k","alignment or word_map or stale")
          Run-Owner @("-m","backend.tools.smoke","--case","voice-ui","--mode","local")
          Run-Owner @("-m","pytest","-q","tests/voice/test_voice_pipeline.py")
      - name: A3-01/02/03 archive original and G-Labs provider regression
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          function Check([string[]]$arguments) {
            & $py @arguments
            if ($LASTEXITCODE -ne 0) { throw "A3 owner command failed: $($arguments -join ' ')" }
          }
          Check @("-m","pytest","-q","tests/assets/test_sources.py","-k","search or paging or hydrate")
          Check @("-m","pytest","-q","tests/assets/test_sources.py","-k","rights or download or provenance")
          Check @("-m","pytest","-q","tests/assets/test_glabs.py","-k","generate or poll or stop or error")
          Check @("-m","pytest","-q","tests/assets/test_sources.py","tests/assets/test_glabs.py")
          Check @("-m","pytest","-q","tests/assets/test_resolution.py","tests/integration/test_phase_a.py")
          Check @("-m","backend.tools.smoke","--case","missing-asset-choice","--mode","local")
          Check @("-m","backend.tools.smoke","--case","asset-ui","--mode","local")
          Check @("-m","backend.tools.smoke","--case","phase-a","--mode","local")
          Check @("-m","pytest","-q","tests/backend/test_foundation.py","tests/voice/test_voice_pipeline.py")
      - name: B1-01/02/03 normalizer, map and alignment Windows owner checks
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          function Check-B1([string[]]$argsList) {
            & $py @argsList
            if ($LASTEXITCODE -ne 0) { throw "B1 owner failed: $($argsList -join ' ')" }
          }
          Check-B1 @("-m","pytest","-q","tests/visual/test_compiler.py","-k","blueprint or payload or role")
          Check-B1 @("-m","pytest","-q","tests/visual/test_compiler.py","-k","map or projection or period")
          Check-B1 @("-m","pytest","-q","tests/visual/test_compiler.py","-k","cue or timing or staging")
          Check-B1 @("-m","backend.tools.smoke","--case","normalize-visual","--mode","local")
          Check-B1 @("-m","backend.tools.smoke","--case","historical-map","--mode","local")
          Check-B1 @("-m","backend.tools.smoke","--case","align-scene-cues","--mode","local")
          Check-B1 @("-m","pytest","-q","tests/visual/test_compiler.py")
      - name: B1-04/05/06 layout motion frozen compiler Windows checks
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          function Check-B1II([string[]]$argsList) {
            & $py @argsList
            if ($LASTEXITCODE -ne 0) { throw "B1 compiler failed: $($argsList -join ' ')" }
          }
          Check-B1II @("-m","pytest","-q","tests/visual/test_compiler.py","-k","layers or typography or slots")
          Check-B1II @("-m","pytest","-q","tests/visual/test_compiler.py","-k","motion or camera or connector")
          Check-B1II @("-m","pytest","-q","tests/visual/test_compiler.py","-k","fingerprint or invariant or deterministic")
          Check-B1II @("-m","backend.tools.smoke","--case","compile-layout","--mode","local")
          Check-B1II @("-m","backend.tools.smoke","--case","compile-motion","--mode","local")
          Check-B1II @("-m","backend.tools.smoke","--case","compile-longform","--mode","local")
          Check-B1II @("-m","pytest","-q","tests/visual/test_compiler.py")
      - name: Chromium browser E2E (real local servers)
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test:e2e -- --grep "project-shell|voice-workflow|asset-review"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
      - name: Upload focused Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1-six-workspace-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
