name: A1 Foundation (Windows)
on:
  push:
    branches: [feat/fullflow-v1-windows]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg and ffprobe installed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check branch diff whitespace against main
        shell: pwsh
        run: |
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: A1 environment, schema and SQLite behavioral tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
