name: Design Contracts (Windows)
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "docs/step01-02/**"
      - "ui/mockups/**"
      - "scripts/check_design_contracts.py"
      - "scripts/validate_visual_design.py"
      - "tests/contracts/**"
      - "requirements-design.txt"
      - ".github/workflows/design-contracts-windows.yml"
  workflow_dispatch:
jobs:
  schemas-and-negatives:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install design-only validator
        run: python -m pip install -r requirements-design.txt
      - name: Validate all schema/example pairs
        run: python scripts/check_design_contracts.py
      - name: Validate visual director, all templates, and motion grammar
        run: python scripts/validate_visual_design.py
      - name: Negative regressions and gate invariants
        run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
