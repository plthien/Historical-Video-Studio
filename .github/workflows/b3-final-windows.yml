name: B3 Delivery II Native Windows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  b3-final:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact-head lineage
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ((git rev-parse HEAD) -ne $expected) { throw "Checkout HEAD does not match workflow head: $expected" }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native FFmpeg and FFprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned Windows environment and builds
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix renderer run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B3-04 queue batch and real restart
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/integration/test_phase_b.py -k "restart or queue or batch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m backend.tools.smoke --case restart-during-render --mode local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B3-05 backup restore and launcher
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/integration/test_phase_b.py -k "backup or restore or package or launch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/start-studio.ps1 -Smoke -NoBrowser -SkipBootstrap -DataRoot .artifacts/launcher-smoke -Port 8173
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: B3-06 synthetic code lane and blocked live preflight
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/e2e/test_full_flow.py -m "not live"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m backend.tools.smoke --case full-flow-two-topics --mode live
          if ($LASTEXITCODE -ne 2) { throw "Live preflight must report BLOCKED without operator inputs" }
      - name: Queue batch and full-flow browser behavior
        shell: pwsh
        run: |
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $env:HVS_B2_FIXTURE = '1'
          $env:HVS_B3_FIXTURE = '1'
          Push-Location frontend
          try {
            node.exe .\node_modules\@playwright\test\cli.js test --grep 'queue|batch|full-flow'
          } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Production and contract regressions
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe scripts/check_design_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe scripts/validate_visual_design.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m pytest -q tests/delivery/test_delivery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final exact-head code ledger
        shell: pwsh
        run: |
          $ledger = Get-Content reports/acceptance/phase-b-code-verdict.json -Raw | ConvertFrom-Json
          $ledger.code_identity = git rev-parse HEAD
          $ledger.tasks.'B3-04'.status = 'CODE_PASS'
          $ledger.tasks.'B3-05'.status = 'CODE_PASS'
          $ledger.tasks.'B3-06'.status = 'LOCAL_CODE_PASS'
          New-Item -ItemType Directory -Force .artifacts/acceptance | Out-Null
          $ledger | ConvertTo-Json -Depth 8 | Set-Content .artifacts/acceptance/phase-b-code-verdict.json -Encoding utf8
          Copy-Item reports/acceptance/full-v1-live-acceptance.json .artifacts/acceptance/
          Copy-Item reports/acceptance/OPERATOR_LIVE_SIGNOFF.md .artifacts/acceptance/
      - name: Upload B3 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-final-native-windows
          path: |
            .artifacts/
            release/windows/*.zip
            release/windows/*/package-manifest.json
            renderer/.artifacts/b3-delivery/
            frontend/test-results/
          if-no-files-found: error
