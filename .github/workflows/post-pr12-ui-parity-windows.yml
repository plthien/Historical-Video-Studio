name: Post-PR12 UI Parity Native Windows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source head and non-destructive change scope
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ((git rev-parse HEAD) -ne $expected) { throw "HEAD mismatch: $expected" }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse Windows launch scripts with native Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/windows/start-studio.ps1',
                              'scripts/windows/verify-frontend-build.ps1',
                              'scripts/windows/read-frontend-manifest.ps1',
                              'tests/windows/test-frontend-manifest-encoding.ps1',
                              'scripts/windows/package.ps1')) {
            $path = (Resolve-Path -LiteralPath $file).Path
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "Non-ASCII launcher byte found in $file; Windows PowerShell 5.1 may misparse BOM-less UTF-8."
            }
            $tokens = $null
            $errorsFound = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errorsFound)
            if ($errorsFound.Count -gt 0) {
              throw "Windows PowerShell parse failed in $file : $($errorsFound[0].Message)"
            }
            Write-Host "POWERSHELL_5_1_PARSE_PASS $file"
          }
      - name: Prove BOM and no-BOM manifest parsing on Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\\tests\\windows\\test-frontend-manifest-encoding.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and verify FFmpeg and ffprobe before environment checks
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --version=7.1.1 --yes --no-progress
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $installed) { throw "Pinned FFmpeg 7.1.1 install failed; verify Chocolatey package" }
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if (-not $ffmpeg -or -not $ffprobe) { throw "Both ffmpeg and ffprobe must be on PATH" }
          Write-Host "FFmpeg: $($ffmpeg.Source)"
          Write-Host "FFprobe: $($ffprobe.Source)"
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Bootstrap isolated native Windows backend
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/verify-environment.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual React production app
        shell: pwsh
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/windows/verify-frontend-build.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path frontend/dist/build-info.json)) { throw "Missing source-bound production build-info" }
          $manifestBytes = [System.IO.File]::ReadAllBytes((Resolve-Path frontend/dist/build-info.json).Path)
          if ($manifestBytes.Length -lt 3) { throw "Frontend build manifest is empty" }
          if ($manifestBytes[0] -eq 239 -and $manifestBytes[1] -eq 187 -and $manifestBytes[2] -eq 191) {
            throw "FRONTEND_BUILD_MANIFEST_BOM_FORBIDDEN: write UTF-8 without BOM."
          }
      - name: Verify frontend hash identity and stale-bundle refusal
        shell: pwsh
        run: |
          $file = "frontend/dist/build-info.json"
          $original = Get-Content -LiteralPath $file -Raw
          try {
            & .\scripts\windows\verify-frontend-build.ps1 -SkipBootstrap | Out-Null
            $tampered = $original | ConvertFrom-Json
            $tampered.source_commit = ('0' * 40)
            $tampered | ConvertTo-Json | Set-Content -LiteralPath $file -Encoding utf8
            $rejected = $false
            try {
              & .\scripts\windows\verify-frontend-build.ps1 -SkipBootstrap | Out-Null
            } catch {
              if ("$_" -match "FRONTEND_BUNDLE_STALE") { $rejected = $true }
              else { throw }
            }
            if (-not $rejected) { throw "Launch accepted a forged stale UI build!" }
          } finally {
            $original | Set-Content -LiteralPath $file -Encoding utf8
          }
          # Verify compiled JS tampering is detected too; index.html may be unchanged.
          $asset = Get-ChildItem -Path frontend/dist/assets -Filter *.js -File | Select-Object -First 1
          if (-not $asset) { throw "No compiled JS asset available to verify bundle identity" }
          $bytes = [System.IO.File]::ReadAllBytes($asset.FullName)
          try {
            [System.IO.File]::AppendAllText($asset.FullName, "\n/* TAMPER_NEGATIVE */")
            $rejectedAsset = $false
            try {
              & .\scripts\windows\verify-frontend-build.ps1 -SkipBootstrap | Out-Null
            } catch {
              if ("$_" -match "FRONTEND_BUNDLE_STALE") { $rejectedAsset = $true }
              else { throw }
            }
            if (-not $rejectedAsset) { throw "Launch accepted a tampered compiled JavaScript asset!" }
          } finally {
            [System.IO.File]::WriteAllBytes($asset.FullName, $bytes)
          }
          & .\scripts\windows\verify-frontend-build.ps1 -SkipBootstrap | Out-Null
      - name: Real Windows PowerShell 5.1 launcher smoke through HTTP SHA verification
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/start-studio.ps1 -Smoke -NoBrowser -SkipBootstrap -EvidencePath .artifacts/pr13-frontend-startup-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content .artifacts/pr13-frontend-startup-smoke.json -Raw | ConvertFrom-Json
          if (-not $evidence.api_ready -or $evidence.ui_status -ne 200 -or
              -not $evidence.process_cleanup -or -not $evidence.frontend_bundle_sha256) {
              throw "Real launcher smoke did not reach verified ready/clean stop."
          }
      - name: Targeted persisted SQLite authoring and G4 guard tests
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe -m pytest -q tests/backend/test_post_pr12_authoring_story.py tests/backend/test_post_pr12_g4_authoring.py tests/backend/test_pr13_g4_positive.py tests/backend/test_ports_config.py tests/backend/test_frontend_build_http.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: New approved State A/B real SQLite and strict geometry acceptance
        shell: pwsh
        env:
          HVS_PARITY_PRODUCTION: '1'
        run: |
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test:e2e -- tests/e2e/ui-redesign.spec.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Retained historical mockup comparison (diagnostic only)
        shell: pwsh
        env:
          HVS_PARITY_PRODUCTION: '1'
        run: |
          Push-Location frontend
          try {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test:e2e -- tests/e2e/ui-parity.spec.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Upload exact-HEAD screenshot, PNG differences and browser traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-pr12-ui-parity-compiled-windows
          path: |
            frontend/.artifacts/ui-parity/
            frontend/.artifacts/ui-redesign/
            frontend/dist/build-info.json
            .artifacts/pr13-frontend-startup-smoke.json
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
